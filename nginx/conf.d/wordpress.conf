# WordPress Development Virtual Host
# Configuração para dev.concertacaoamazonia.com.br
# Autor: Daniel Cambría
# Atualizado: 2025-12-02 - Adicionado suporte HTTPS

# HTTP - Redireciona para HTTPS (exceto healthcheck)
server {
    listen 80;
    server_name dev.concertacaoamazonia.com.br cambrasmax.local concertacao.bureau-it.com localhost _;

    # Endpoint de health check (sem redirect)
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Redirecionar todo o resto para HTTPS
    location / {
        return 301 https://$host:8484$request_uri;
    }
}

# HTTPS - Servidor principal
server {
    listen 443 ssl http2;
    server_name dev.concertacaoamazonia.com.br cambrasmax.local concertacao.bureau-it.com localhost _;

    # Certificados SSL
    ssl_certificate /etc/nginx/ssl/cambrasmax.local.crt;
    ssl_certificate_key /etc/nginx/ssl/cambrasmax.local.key;

    # Configurações SSL modernas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    root /var/www/html;
    index index.php index.html index.htm;

    # Logs específicos do site
    access_log /var/log/nginx/wordpress_access.log main;
    error_log /var/log/nginx/wordpress_error.log warn;

    # Endpoint de health check
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Proxy para tiles do mapa (tileserver container na rede frontend)
    # ^~ garante prioridade sobre location ~* \.png$ (arquivos estáticos)
    # Nota: com variável no proxy_pass, usar $request_uri para preservar path completo
    location ^~ /tiles/ {
        resolver 127.0.0.11 valid=10s;
        set $tileserver tileserver;
        proxy_pass http://$tileserver$request_uri;
        add_header 'Access-Control-Allow-Origin' '*' always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Bloquear acesso a arquivos sensíveis
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # WordPress: bloquear wp-config.php e outros arquivos sensíveis
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }

    # Bloquear acesso direto a "archives" de diretório em uploads, como:
    # /wp-content/uploads/2026
    # /wp-content/uploads/2026/04
    # Isso não é archive do WordPress; é path estático resolvido pelo Nginx.
    # Nota: usa [0-9][0-9]... em vez de {N} porque nginx parseia chaves como blocos
    location ~ "^(?:/[_0-9a-zA-Z-]+)?/wp-content/uploads/[0-9][0-9][0-9][0-9](?:/[0-9][0-9])?/?$" {
        return 404;
    }

    # Uploads do blog principal: arquivo nao encontrado retorna 404 puro,
    # nunca cai no PHP (evita WP renderizar archive.php "Arquivos" em URLs malformadas).
    # ^~ tem prioridade sobre regex location ~* abaixo; multisite subsites
    # (ex: /cultura/wp-content/uploads/) sao resolvidos pelas locations
    # ^/[_0-9a-zA-Z-]+/(wp-content/.+)$ que reescrevem ANTES de chegar aqui.
    #
    # AVIF/WebP cascade DENTRO do prefix location: nested regex reativa
    # match-by-extension para imagens raster, mantendo =404 para outros tipos.
    location ^~ /wp-content/uploads/ {
        # Imagens raster: cascata avif -> webp -> raster
        location ~* \.(jpg|jpeg|png)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
            add_header Vary Accept;
            access_log off;
            try_files $uri$avif_suffix $uri$webp_suffix $uri =404;
        }
        # Derivados sidecar (.jpg.avif, .jpg.webp) acessados diretamente
        location ~* \.(jpg|jpeg|png)\.(avif|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
            add_header Vary Accept;
            access_log off;
            try_files $uri =404;
        }
        # ── Elementor self-hosted Google Fonts: neutraliza o host absoluto ──
        #
        # O Elementor grava os @font-face em uploads/elementor/google-fonts/css/
        # com a URL ABSOLUTA do host da requisição que gerou o cache. Em dev há
        # 2 hosts válidos (cambrasmax.local:8484 direto e o tunnel Cloudflare),
        # então o host "perdedor" da corrida recebe um CSS que aponta para o
        # OUTRO host.
        #
        # Pelo tunnel isso vira uma requisição PÚBLICA -> LOOPBACK, e o Chrome
        # 148+ bloqueia por Local Network Access ("Permission was denied for
        # this request to access the `loopback` address space"). NENHUM header
        # resolve: Access-Control-Allow-Origin cobre CORS clássico, não
        # travessia de address space — essa exige permissão do usuário no
        # browser. Resultado: Poppins/Rubik não carregam e o texto cai no font
        # stack do sistema (sintoma: "fonte antiga" no frontend, correta no
        # editor Elementor, que é aberto direto em cambrasmax.local).
        #
        # Fix: reescrever para root-relative, tornando a fonte SAME-ORIGIN em
        # qualquer um dos hosts — sem cruzar address space. sub_filter roda
        # antes do gzip na cadeia de filtros; não há gzip_static aqui.
        location ~* /elementor/google-fonts/css/.+\.css$ {
            sub_filter_types text/css;
            sub_filter_once  off;
            sub_filter 'https://cambrasmax.local:8484/wp-content/' '/wp-content/';
            sub_filter 'https://concertacao.bureau-it.com/wp-content/' '/wp-content/';
            # Sem immutable: o corpo depende do host, e o ?ver= do Elementor só
            # muda quando a fonte é regerada.
            expires 1h;
            add_header X-Content-Type-Options nosniff;
            add_header Vary Accept-Encoding;
            access_log off;
            try_files $uri =404;
        }
        # Fontes (Elementor self-hosted Google Fonts vive em
        # uploads/elementor/google-fonts/fonts/*.woff2): CORS permissivo.
        # Mantido para o caso de a fonte ser pedida cross-origin por um CSS
        # que não passou pelo sub_filter acima (ex: CSS de plugin/tema com
        # URL absoluta). Fontes são conteúdo estático público, então
        # Access-Control-Allow-Origin: * é seguro. Atenção: isto NÃO resolve
        # bloqueio de Local Network Access — ver comentário do bloco acima.
        location ~* \.(woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
            add_header Access-Control-Allow-Origin "*" always;
            access_log off;
            try_files $uri =404;
        }
        # Outros uploads (PDF, ZIP, etc): apenas o arquivo ou 404
        try_files $uri =404;
    }

    location ~* ^/(wp-config\.php|wp-config\.txt|readme\.html|license\.txt) {
        deny all;
    }

    # Bloquear indexacao de PDFs pelo Google
    # PDFs devem ser acessados via pagina de publicacao, nao diretamente
    location ~* \.pdf$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # =========================================================================
    # WordPress Multisite (subdirectory mode)
    # IMPORTANTE: estas locations DEVEM vir ANTES da location de arquivos
    # estáticos, senão .js/.css/.woff2 do subsite são capturados como 404
    # =========================================================================

    # WordPress Multisite: uploads de subsites (subdirectory mode)
    location ~ ^/[_0-9a-zA-Z-]+/files/(.*)$ {
        try_files /wp-includes/ms-files.php =404;
        access_log off;
        log_not_found off;
        expires max;
    }

    # WordPress Multisite: redirect /subsite/wp-admin to /subsite/wp-admin/
    location ~ ^/[_0-9a-zA-Z-]+/wp-admin$ {
        return 301 $scheme://$http_host$request_uri/;
    }

    # WordPress Multisite: rewrite /subsite/wp-admin/* to /wp-admin/*
    # Usa rewrite...last para re-avaliar locations (PHP processado pelo FPM)
    location ~ ^/[_0-9a-zA-Z-]+/(wp-admin/.*)$ {
        rewrite ^/[_0-9a-zA-Z-]+/(wp-admin/.*) /$1 last;
    }

    # WordPress Multisite: rewrite /subsite/wp-*.php to /wp-*.php
    # Usa rewrite...last para que o PHP seja processado pelo FPM
    location ~ ^/[_0-9a-zA-Z-]+/(wp-[^/]+\.php)$ {
        rewrite ^/[_0-9a-zA-Z-]+/(wp-[^/]+\.php)$ /$1 last;
    }

    # WordPress Multisite: rewrite /subsite/wp-includes/* to /wp-includes/*
    location ~ ^/[_0-9a-zA-Z-]+/(wp-includes/.+)$ {
        rewrite ^/[_0-9a-zA-Z-]+/(wp-includes/.+) /$1 last;
    }

    # WordPress Multisite: rewrite /subsite/wp-content/* to /wp-content/*
    location ~ ^/[_0-9a-zA-Z-]+/(wp-content/.+)$ {
        rewrite ^/[_0-9a-zA-Z-]+/(wp-content/.+) /$1 last;
    }

    # AVIF/WebP automatic delivery via try_files cascade.
    # AVIF preferido (mais eficiente); WebP fallback; raster como ultimo recurso.
    # Maps avif_suffix/webp_suffix definidos em nginx.conf.
    # DEVE vir ANTES da location de arquivos estaticos.
    location ~* \.(jpg|jpeg|png)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Vary Accept;
        access_log off;
        try_files $uri$avif_suffix $uri$webp_suffix $uri =404;
    }

    # Servir derivados sidecar (.jpg.avif, .jpg.webp) com Content-Type correto
    location ~* \.(jpg|jpeg|png)\.(avif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Vary Accept;
        access_log off;
        try_files $uri =404;
    }

    # Fontes: CORS permissivo. Necessário porque o Elementor self-hosted
    # Google Fonts (poppins.css/rubik.css etc.) cacheia em disco com a URL
    # absoluta do host da PRIMEIRA requisição que gerou o arquivo — e este
    # dev tem 2 hosts válidos (cambrasmax.local:8484 direto + tunnel Cloudflare
    # concertacao.bureau-it.com). O ob_start rewrite do tunnel-url-rewrite.php
    # só reescreve respostas PHP dinâmicas, não arquivos .css já cacheados em
    # disco — então o host "perdedor" da corrida sempre bate CORS ao carregar
    # a fonte de um host diferente do que gerou o cache. Fontes são conteúdo
    # estático público; permitir Access-Control-Allow-Origin: * aqui é seguro
    # e elimina o problema independente de qual host gerou o cache.
    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # ── WP Rocket minify: neutraliza o host absoluto nas cópias de CSS ──
    #
    # O minify do WP Rocket LÊ o CSS do disco e grava uma cópia em
    # wp-content/cache/min/<blog>/... — carregando junto as URLs absolutas que o
    # Elementor cravou nos @font-face. O sub_filter da location de /uploads/ não
    # alcança essa cópia (path diferente), e reescrever só o arquivo-fonte não
    # basta: o minificador lê do FILESYSTEM, não via HTTP.
    #
    # Sem isto, pelo tunnel Cloudflare a fonte é buscada em cambrasmax.local
    # (loopback) a partir de uma origem pública, e o Chrome 148+ bloqueia por
    # Local Network Access — Poppins/Rubik não carregam e o texto cai no font
    # stack do sistema. Ver comentário completo na location de /uploads/.
    #
    # ^~ é obrigatório: garante prioridade sobre a regex \.(js|css|...)$ abaixo,
    # que de outra forma serviria o arquivo sem passar pelo filtro.
    #
    # AO VALIDAR: o page cache do WP Rocket é POR HOST
    # (wp-content/cache/wp-rocket/<hostname>/), e o HTML cacheado do tunnel
    # continua referenciando as URLs antigas de /cache/min/ — dá a impressão de
    # que o sub_filter não funcionou. rocket_clean_domain() limpa só o host
    # resolvido por home_url() na chamada; para o tunnel:
    #   wp --url="https://concertacao.bureau-it.com" eval 'rocket_clean_domain();'
    # O HTML não é cacheado no edge (cf-cache-status: DYNAMIC), então não precisa
    # de purge na Cloudflare. Validar o origin antes de culpar o edge:
    #   curl -k -H "Host: concertacao.bureau-it.com" https://cambrasmax.local:8484/...
    location ^~ /wp-content/cache/min/ {
        # sub_filter no nivel do bloco, e nao dentro de cada location aninhada:
        # o nginx herda as diretivas sub_filter para a location interna QUANDO
        # ela nao declara nenhuma. Duas copias divergiriam (bastaria alguem
        # acrescentar um host de tunnel em uma so).
        sub_filter_types text/css;
        sub_filter_once  off;
        sub_filter 'https://cambrasmax.local:8484/wp-content/' '/wp-content/';
        sub_filter 'https://concertacao.bureau-it.com/wp-content/' '/wp-content/';

        # Minify ausente: servir o ORIGINAL em vez de 404 text/html.
        #
        # Sem isto, um minify apagado (ex.: o WP Rocket limpando cache apos um
        # update de traducao do WordPress) vira 404 text/html; o strict MIME do
        # browser recusa o CSS e a pagina chega crua ao visitante.
        #
        # Depende de minify_concatenate_css=0: sem concatenacao cada URL de
        # minify espelha 1:1 o caminho do fonte. Com concatenacao os nomes viram
        # hash, o mapeamento some e este bloco degrada para o =404 de baixo --
        # sem piorar nada, mas sem proteger (o css-health.sh avisa).
        #
        # O grupo (?:[^/]+/)? absorve o prefixo de subsite do blog 2
        # (min/2/cultura/wp-content/...). A captura e ancorada em
        # wp-content|wp-includes de proposito: sem a ancora, o grupo opcional
        # engoliria "wp-content/" e o fallback apontaria para o caminho errado.
        #
        # ESTA location aninhada e obrigatoria: o ^~ acima ganha de qualquer
        # location regex irma, entao um bloco no nivel do server seria ignorado.
        location ~* ^/wp-content/cache/min/[0-9]+/(?:[^/]+/)?((?:wp-content|wp-includes)/.+\.(?:css|js))$ {
            # Sem immutable: o corpo depende do host que gerou o cache do minify.
            expires 1h;
            add_header X-Content-Type-Options nosniff;
            add_header Vary Accept-Encoding;
            access_log off;
            try_files $uri /$1 =404;
        }

        # CSS fora do padrao acima (ex.: cache/min/3rd-party/<nome-achatado>/):
        # nao ha mapeamento 1:1 para o fonte, entao aqui so vale o sub_filter.
        location ~* \.css$ {
            expires 1h;
            add_header X-Content-Type-Options nosniff;
            add_header Vary Accept-Encoding;
            access_log off;
            try_files $uri =404;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
        try_files $uri =404;
    }

    # Otimização para arquivos estáticos
    # DEVE vir APÓS as regras multisite para que rewrites sejam processados primeiro
    location ~* \.(js|css|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    # WordPress: pretty permalinks (multisite-compatible)
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # WordPress: handle PHP files
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Proxy para PHP-FPM (resolução dinâmica)
        set $upstream wordpress:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Passar os cabeçalhos corretos para o PHP-FPM
        fastcgi_param HOST $http_host;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param SERVER_PORT $server_port;
        fastcgi_param HTTPS on;

        # Cloudflare Tunnel: IP real do visitante
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip if_not_empty;

        # Configurações de performance
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 180s;
        fastcgi_read_timeout 180s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_intercept_errors on;
    }

    # WordPress: handle requests to wp-admin
    location ~ ^/(wp-admin|wp-login\.php) {
        try_files $uri $uri/ /index.php?$args;

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            set $upstream wordpress:9000;
            fastcgi_pass $upstream;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;

            fastcgi_param WP_ENV "dev";
            fastcgi_param HTTP_PROXY "";
            fastcgi_param HTTPS on;
            fastcgi_param SERVER_PORT 443;

            # Timeouts maiores para admin
            fastcgi_connect_timeout 60s;
            fastcgi_send_timeout 300s;
            fastcgi_read_timeout 300s;
        }
    }

    # WordPress: handle wp-cron.php with longer timeout
    location = /wp-cron.php {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        set $upstream wordpress:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_param WP_ENV "dev";
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;

        # Timeout longo para cron
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 600s;
        fastcgi_read_timeout 600s;
    }

    # WordPress: upload progress for large files
    location ~ ^/wp-admin/async-upload\.php$ {
        client_max_body_size 100M;

        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        set $upstream wordpress:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_param WP_ENV "dev";
        fastcgi_param HTTPS on;

        # Upload timeouts
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
    }

    # Security headers para desenvolvimento
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    # HSTS desabilitado em dev para facilitar testes
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
